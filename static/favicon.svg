<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- favicon da marca: simbolo </> em azul neon -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06121c"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fundo)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#00d4ff" stroke-opacity="0.25" stroke-width="2"/>
  <g fill="none" stroke="#00d4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#brilho)">
    <polyline points="22,20 10,32 22,44"/>
    <polyline points="42,20 54,32 42,44"/>
    <line x1="36" y1="16" x2="28" y2="48"/>
  </g>
</svg>
