<!DOCTYPE html>
<html>
<head>
    <title>Daniel Mota - Desenvolvedor</title>
    <style>
        body {
            font-family: Arial;
            background-image: url("/static/fundo.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #2607f1;
            padding: 15px;
        }
        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        .hero {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 80px 20px;
            margin: 50px auto;
            width: 70%;
            border-radius: 15px;
        }
        .hero h1 {
            color: white;
            font-size: 48px;
        }
        .hero p {
            color: #ccc;
            font-size: 20px;
        }
        .botao {
            background-color: #2607f1;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }
        .botao:hover {
            background-color: #1a05b0;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Inicio</a>
        <a href="/sobre">Sobre</a>
        <a href="/projetos">Projetos</a>
        <a href="/contato">Contato</a>
    </nav>
    <div class="hero">
        <h1>Daniel Mota</h1>
        <p>Desenvolvedor de Sites e Sistemas</p>
        <p>Transformo ideias em produtos digitais reais!</p>
        <br>
        <a href="/projetos"><button class="botao">ver meus projetos</button></a>
        <a href="/contato"><button class="botao">entre em contato</button></a>
    </div>
</body>
</html>
