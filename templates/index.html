<!DOCTYPE html>
<html>
<head>
    <title>Daniel Mota - Desenvolvedor</title>
    <style>
        body {
            font-family: Arial;
            background-image: url("/static/fundo.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #2607f1;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        .bandeiras { margin-right: 15px; }
        .bandeira {
            width: 35px;
            height: 25px;
            cursor: pointer;
            margin: 5px;
            border-radius: 3px;
            border: 2px solid white;
        }
        .hero {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 80px 20px;
            margin: 50px auto;
            width: 70%;
            border-radius: 15px;
        }
        .hero h1 { color: white; font-size: 48px; }
        .hero p { color: #ccc; font-size: 20px; }
        .botao {
            background-color: #2607f1;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav>
        <div>
            <a href="/" id="nav-inicio">Inicio</a>
            <a href="/sobre" id="nav-sobre">Sobre</a>
            <a href="/projetos" id="nav-projetos">Projetos</a>
            <a href="/contato" id="nav-contato">Contato</a>
        </div>
        <div class="bandeiras">
            <img src="https://flagcdn.com/w40/br.png" onclick="aplicarIdioma('pt')" class="bandeira" title="Português">
            <img src="https://flagcdn.com/w40/es.png" onclick="aplicarIdioma('es')" class="bandeira" title="Español">
            <img src="https://flagcdn.com/w40/gb.png" onclick="aplicarIdioma('en')" class="bandeira" title="English">
        </div>
    </nav>

    <div class="hero">
        <h1 id="titulo">Daniel Mota</h1>
        <p id="subtitulo">Desenvolvedor de Sites e Sistemas</p>
        <p id="descricao">Transformo ideias em produtos digitais reais!</p>
        <br>
        <a href="/projetos"><button class="botao" id="btn-projetos">Ver meus projetos</button></a>
        <a href="/contato"><button class="botao" id="btn-contato">Entre em contato</button></a>
    </div>

    <script>
        var textos = {
            pt: {
                inicio: "Inicio", sobre: "Sobre", projetos: "Projetos", contato: "Contato",
                subtitulo: "Desenvolvedor de Sites e Sistemas",
                descricao: "Transformo ideias em produtos digitais reais!",
                btnProjetos: "Ver meus projetos", btnContato: "Entre em contato"
            },
            es: {
                inicio: "Inicio", sobre: "Sobre mí", projetos: "Proyectos", contato: "Contacto",
                subtitulo: "Desarrollador de Sitios y Sistemas",
                descricao: "Transformo ideas en productos digitales reales!",
                btnProjetos: "Ver mis proyectos", btnContato: "Contáctame"
            },
            en: {
                inicio: "Home", sobre: "About", projetos: "Projects", contato: "Contact",
                subtitulo: "Website and Systems Developer",
                descricao: "I transform ideas into real digital products!",
                btnProjetos: "See my projects", btnContato: "Contact me"
            }
        }

        function aplicarIdioma(idioma) {
            localStorage.setItem("idioma", idioma)
            var t = textos[idioma]
            document.getElementById("nav-inicio").innerText = t.inicio
            document.getElementById("nav-sobre").innerText = t.sobre
            document.getElementById("nav-projetos").innerText = t.projetos
            document.getElementById("nav-contato").innerText = t.contato
            document.getElementById("subtitulo").innerText = t.subtitulo
            document.getElementById("descricao").innerText = t.descricao
            document.getElementById("btn-projetos").innerText = t.btnProjetos
            document.getElementById("btn-contato").innerText = t.btnContato
        }

        var idiomaSalvo = localStorage.getItem("idioma") || "pt"
        aplicarIdioma(idiomaSalvo)
    </script>
</body>
</html>
