<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- pagina de confirmacao: nao precisa aparecer no Google -->
    <meta name="robots" content="noindex">
    <title>Mensaje enviado — {{ MARCA }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            color: #00d4ff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .marca-label { font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 4px; color: #fff; margin-bottom: 16px; }
        .marca-destaque { color: #00d4ff; text-shadow: 0 0 12px #00d4ff, 0 0 4px #00d4ff; }
        .secao-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: rgba(0, 212, 255, 0.4);
            letter-spacing: 6px;
            margin-bottom: 12px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            color: #fff;
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        .linha-divisoria {
            width: 60px;
            height: 1px;
            background: #00d4ff;
            margin: 0 auto 30px;
            box-shadow: 0 0 10px #00d4ff;
        }
        p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 17px;
            line-height: 2;
            max-width: 520px;
            margin-bottom: 50px;
        }
        .botao-jarvis {
            padding: 14px 35px;
            border: 1px solid #00d4ff;
            background: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            text-decoration: none;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .botao-jarvis:hover {
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.3);
            color: #fff;
        }

        @media (max-width: 768px) {
            h1 { font-size: 24px; letter-spacing: 3px; }
        }
    </style>
</head>
<body>

    <div class="marca-label">{{ MARCA_HTML }}</div>
    <h1 id="obrigado-titulo">¡MENSAJE ENVIADO!</h1>
    <div class="linha-divisoria"></div>
    <p id="obrigado-texto">Gracias por tu mensaje. Te responderemos en menos de 24 horas.</p>
    <a href="/" class="botao-jarvis" id="obrigado-botao">VOLVER AL INICIO</a>

    <script>
        var textos = {
            pt: { titulo: "MENSAGEM ENVIADA!", texto: "Obrigado pela mensagem. Responderemos em menos de 24 horas.", botao: "VOLTAR AO INÍCIO", aba: "Mensagem enviada" },
            es: { titulo: "¡MENSAJE ENVIADO!", texto: "Gracias por tu mensaje. Te responderemos en menos de 24 horas.", botao: "VOLVER AL INICIO", aba: "Mensaje enviado" },
            en: { titulo: "MESSAGE SENT!", texto: "Thanks for your message. We'll get back to you within 24 hours.", botao: "BACK TO HOME", aba: "Message sent" }
        }

        // mesmo idioma escolhido no site (padrao: espanhol)
        var idioma = "es"
        try { idioma = localStorage.getItem("idioma") || "es" } catch (e) {}  // modo anonimo pode bloquear
        var t = textos[idioma] || textos.es
        document.documentElement.lang = textos[idioma] ? idioma : "es"
        document.title = t.aba + " — " + {{ MARCA|tojson }}
        document.getElementById("obrigado-titulo").innerText = t.titulo
        document.getElementById("obrigado-texto").innerText = t.texto
        document.getElementById("obrigado-botao").innerText = t.botao
    </script>
</body>
</html>
