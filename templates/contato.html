<!DOCTYPE html>
<html>
<head>
    <title>Contato - Daniel Mota</title>
    <style>
        body {
            font-family: Arial;
            background-color: #1a1a2e;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #2607f1;
            padding: 15px;
        }
        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        h1 {
            color: white;
            font-size: 42px;
            margin-top: 30px;
        }
        p {
            color: #ccc;
            font-size: 18px;
        }
        .formulario {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            margin: 30px auto;
            width: 50%;
            border-radius: 15px;
        }
        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        textarea {
            height: 120px;
        }
        .botao {
            background-color: #2607f1;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Inicio</a>
        <a href="/sobre">Sobre</a>
        <a href="/projetos">Projetos</a>
        <a href="/contato">Contato</a>
    </nav>

    <h1>Entre em Contato!</h1>
    <p>Tem um projeto em mente? Vamos conversar!!</p>

    <div class="formulario">
        <form action="https://formspree.io/f/xojrgolb" method="POST">
            <input type="text" name="nome" placeholder="Seu nome completo" required><br>
            <input type="email" name="email" placeholder="Seu email" required><br>
            <input type="text" name="empresa" placeholder="Sua empresa (opcional)"><br>
            <textarea name="mensagem" placeholder="Descreva seu projeto..." required></textarea><br>
            <button class="botao" type="submit">enviar mensagem</button>
        </form>
    </div>
</body>
</html>
