<!DOCTYPE html>
<html>
<head>
    <title>Contato - Daniel Mota</title>
    <style>
        body {
            font-family: Arial;
            background-color: #1a1a2e;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #2607f1;
            padding: 15px;
        }
        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        h1 {
            color: white;
            font-size: 42px;
            margin-top: 30px;
        }
        p {
            color: #ccc;
            font-size: 18px;
        }
        .formulario {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            margin: 30px auto;
            width: 50%;
            border-radius: 15px;
        }
        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        textarea {
            height: 120px;
        }
        .botao {
            background-color: #2607f1;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }
        .botao:hover {
            background-color: #1a05b0;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Inicio</a>
        <a href="/sobre">Sobre</a>
        <a href="/projetos">Projetos</a>
        <a href="/contato">Contato</a>
    </nav>

    <h1>Entre em Contato!</h1>
    <p>Tem um projeto em mente? Vamos conversar!!</p>

    <div class="formulario">
        <input type="text" id="nome" placeholder="Seu nome completo"><br>
        <input type="email" id="email" placeholder="Seu email"><br>
        <input type="text" id="empresa" placeholder="Sua empresa (opcional)"><br>
        <textarea id="mensagem" placeholder="Descreva seu projeto ou mensagem..."></textarea><br>
        <button class="botao" onclick="enviar()">enviar mensagem</button>
    </div>

    <script>
        function enviar() {
            var nome = document.getElementById("nome").value
            var email = document.getElementById("email").value
            var mensagem = document.getElementById("mensagem").value
            if (nome == "" || email == "" || mensagem == "") {
                alert("Por favor preencha os campos obrigatorios!")
            } else {
                alert("Obrigado " + nome + "! Sua mensagem foi enviada com sucesso! Entrarei em contato em breve!")
            }
        }
    </script>
</body>
</html>
